      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadowTeeGraph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#881337" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgTeeGraph)" rx="24"/>
  <ellipse cx="300" cy="390" rx="190" ry="20" fill="#475569" opacity="0.14"/>
