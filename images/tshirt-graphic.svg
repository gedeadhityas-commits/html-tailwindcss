    <path d="M190 250 L290 250" stroke="#f59e0b" stroke-width="2"/>
    <text x="240" y="275" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="3">TOKYO</text>
    <text x="240" y="165" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="2">URBAN STREETWEAR</text>
