<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="soleTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <filter id="shadowTrail" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgTrail)" rx="24"/>
  <ellipse cx="300" cy="375" rx="210" ry="22" fill="#78350f" opacity="0.14"/>
  <g filter="url(#shadowTrail)" transform="translate(45, 30)">
    <!-- Rugged Lug Sole -->
    <path d="M80 305 Q120 310 160 308 Q200 312 250 308 Q310 310 380 305 Q420 300 445 280 C455 310 435 335 360 342 C220 345 100 340 80 305 Z" fill="url(#soleTrail)"/>
    <!-- Deep Traction Lugs -->
    <rect x="120" y="325" width="22" height="10" rx="3" fill="#0f766e"/>
    <rect x="170" y="328" width="22" height="10" rx="3" fill="#0f766e"/>
    <rect x="220" y="330" width="22" height="10" rx="3" fill="#0f766e"/>
    <rect x="270" y="330" width="22" height="10" rx="3" fill="#0f766e"/>
    <rect x="320" y="327" width="22" height="10" rx="3" fill="#0f766e"/>
    <rect x="370" y="320" width="22" height="10" rx="3" fill="#0f766e"/>
    <!-- Anatomical Footbed -->
    <path d="M85 300 C100 290 200 290 320 285 C380 280 435 275 440 282 C430 295 380 302 320 302 C180 302 95 302 85 300 Z" fill="#d97706"/>
    <!-- Heavy Duty Webbing Straps -->
    <!-- Front Toe Strap -->
    <path d="M120 295 C125 240 180 235 210 290" stroke="#0f766e" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M120 295 C125 240 180 235 210 290" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Midfoot Cross Strap & Buckle -->
    <path d="M220 285 C240 210 310 200 350 280" stroke="#1e293b" stroke-width="18" stroke-linecap="round" fill="none"/>
    <rect x="270" y="215" width="28" height="16" rx="4" fill="#f59e0b"/>
    <!-- Heel Strap -->
    <path d="M340 280 C360 230 420 230 430 280" stroke="#0f766e" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
</svg>
