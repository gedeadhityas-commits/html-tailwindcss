<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTeeOver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="teeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowTee" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgTeeOver)" rx="24"/>
  <ellipse cx="300" cy="390" rx="190" ry="20" fill="#1e293b" opacity="0.15"/>
  <g filter="url(#shadowTee)" transform="translate(60, 25)">
    <!-- Boxy Drop-Shoulder Oversized Cut -->
    <path d="M180 80 C215 105 265 105 300 80 L395 130 L365 195 L335 180 L335 355 L145 355 L145 180 L115 195 L85 130 Z" fill="url(#teeBody)"/>
    <!-- Chunky Heavyweight Crewneck Rib Collar -->
    <path d="M180 80 C215 108 265 108 300 80 L293 92 C263 116 217 116 187 92 Z" fill="#0f172a"/>
    <!-- Boxy Wide Sleeves Hem Stitches -->
    <line x1="88" y1="135" x2="118" y2="198" stroke="#475569" stroke-width="2"/>
    <line x1="392" y1="135" x2="362" y2="198" stroke="#475569" stroke-width="2"/>
    <!-- Bottom Hem Heavy Stitch -->
    <line x1="145" y1="345" x2="335" y2="345" stroke="#475569" stroke-width="2.5"/>
    <!-- Center Minimalist Signature Print -->
    <text x="240" y="210" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="4">ESSENTIALS</text>
    <text x="240" y="228" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="3">24S COTTON COMBED</text>
  </g>
</svg>
