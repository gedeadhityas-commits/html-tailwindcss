<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDuffle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="duffleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowDuffle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgDuffle)" rx="24"/>
  <ellipse cx="300" cy="385" rx="220" ry="22" fill="#334155" opacity="0.15"/>
  <g filter="url(#shadowDuffle)" transform="translate(50, 40)">
    <!-- Carry Handles Loop -->
    <path d="M190 200 C190 100 240 70 270 70 C300 70 350 100 350 200" stroke="#0f766e" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M160 190 C160 110 200 80 250 80 C290 80 320 110 320 190" stroke="#10b981" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Main Cylindrical Duffle Body -->
    <rect x="80" y="160" width="340" height="180" rx="36" fill="url(#duffleBody)"/>
    <!-- Side Shoe Compartment Panel -->
    <path d="M370 160 C405 160 425 185 425 250 C425 315 405 340 370 340 Z" fill="#0f172a"/>
    <path d="M380 200 C400 200 410 220 410 250 C410 280 400 300 380 300" stroke="#0f766e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Dual Reinforcement Webbing Straps -->
    <rect x="180" y="160" width="22" height="180" fill="#0f766e"/>
    <rect x="300" y="160" width="22" height="180" fill="#0f766e"/>
    <!-- Front Quick-Access Zipper Pocket -->
    <rect x="215" y="210" width="70" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="225" y1="230" x2="275" y2="230" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 35L Capacity Tag -->
    <rect x="235" y="250" width="30" height="16" rx="3" fill="#0f766e"/>
    <text x="250" y="262" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">35L</text>
  </g>
</svg>
