<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="highUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="shadowHigh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgHigh)" rx="24"/>
  <ellipse cx="300" cy="380" rx="210" ry="22" fill="#312e81" opacity="0.14"/>
  <g filter="url(#shadowHigh)" transform="translate(45, 20)">
    <!-- Chunky Platform Sole -->
    <path d="M75 310 C140 315 320 315 440 290 C450 320 435 342 360 348 C220 350 100 345 75 310 Z" fill="#ffffff" stroke="#e4e4e7" stroke-width="2.5"/>
    <path d="M90 328 L430 310" stroke="#d4d4d8" stroke-width="3"/>
    <!-- High-Top Upper Body -->
    <path d="M80 305 C85 250 160 235 210 220 C240 210 260 110 320 95 C360 85 410 100 410 140 C415 190 425 240 430 285 C360 298 180 305 80 305 Z" fill="url(#highUpper)"/>
    <!-- Ankle Patch / Circle Badge -->
    <circle cx="360" cy="155" r="24" fill="#ffffff"/>
    <polygon points="360,138 367,152 382,154 371,165 374,180 360,172 346,180 349,165 338,154 353,152" fill="#0f766e"/>
    <!-- Rubber Toe Cap -->
    <path d="M80 305 C85 260 125 245 155 250 C140 285 115 305 80 305 Z" fill="#ffffff"/>
    <!-- High-Top Lacing Rows -->
    <circle cx="230" cy="215" r="4" fill="#a1a1aa"/>
    <circle cx="250" cy="190" r="4" fill="#a1a1aa"/>
    <circle cx="270" cy="165" r="4" fill="#a1a1aa"/>
    <circle cx="290" cy="140" r="4" fill="#a1a1aa"/>
    <circle cx="310" cy="115" r="4" fill="#a1a1aa"/>
    <path d="M225 215 L245 190 M245 190 L265 165 M265 165 L285 140 M285 140 L305 115" stroke="#f4f4f5" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
