<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <pattern id="nauticalStripes" width="100" height="24" patternUnits="userSpaceOnUse">
      <rect width="100" height="12" fill="#ffffff"/>
      <rect y="12" width="100" height="12" fill="#1e3a8a"/>
    </pattern>
    <filter id="shadowStripe" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgStripe)" rx="24"/>
  <ellipse cx="300" cy="390" rx="190" ry="20" fill="#1e3a8a" opacity="0.14"/>
  <g filter="url(#shadowStripe)" transform="translate(60, 25)">
    <!-- Nautical Striped Tee Body -->
    <path d="M185 80 C215 102 265 102 295 80 L385 125 L355 185 L330 170 L330 355 L150 355 L150 170 L125 185 L95 125 Z" fill="url(#nauticalStripes)" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Solid Navy Collar Rib -->
    <path d="M185 80 C215 105 265 105 295 80 L288 90 C263 112 217 112 192 90 Z" fill="#1e3a8a"/>
    <!-- Small Embroidered Anchor/Logo -->
    <circle cx="210" cy="150" r="12" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
    <path d="M210 142 L210 156 M205 152 Q210 160 215 152" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
