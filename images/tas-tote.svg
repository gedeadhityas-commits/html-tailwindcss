<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="toteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <filter id="shadowTote" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#78350f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgTote)" rx="24"/>
  <ellipse cx="300" cy="390" rx="170" ry="18" fill="#78350f" opacity="0.15"/>
  <g filter="url(#shadowTote)" transform="translate(60, 20)">
    <!-- Long Canvas Shoulder Straps -->
    <path d="M170 190 C170 80 200 50 240 50 C280 50 310 80 310 190" stroke="#0f766e" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M150 190 C150 90 180 60 240 60 C300 60 330 90 330 190" stroke="#047857" stroke-width="4" fill="none" opacity="0.7"/>
    <!-- Main Tote Body (Trapezoidal Canvas) -->
    <polygon points="120,180 360,180 340,360 140,360" fill="url(#toteBody)" stroke="#e7e5e4" stroke-width="2"/>
    <!-- Heavy Canvas Base / Contrast Bottom -->
    <polygon points="135,310 345,310 340,360 140,360" fill="#0f766e"/>
    <!-- Center Minimalist Typography Graphic -->
    <rect x="180" y="215" width="120" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="240" y="245" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">IGAS</text>
    <text x="240" y="260" fill="#0f766e" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="1.5">URBAN LIVING</text>
    <circle cx="240" cy="272" r="3" fill="#f59e0b"/>
  </g>
</svg>
