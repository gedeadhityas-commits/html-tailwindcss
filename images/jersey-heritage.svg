<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHeri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="heriBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadowHeri" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1e3a8a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgHeri)" rx="24"/>
  <ellipse cx="300" cy="390" rx="190" ry="20" fill="#172554" opacity="0.14"/>
  <g filter="url(#shadowHeri)" transform="translate(60, 25)">
    <!-- Heritage Jersey Body -->
    <path d="M190 70 C220 85 260 85 290 70 L380 115 L350 170 L320 155 L320 350 L160 350 L160 155 L130 170 L100 115 Z" fill="url(#heriBody)"/>
    <!-- Classic Polo Collar -->
    <path d="M190 70 L240 120 L290 70 L280 60 C250 55 230 55 200 60 Z" fill="#ffffff"/>
    <polygon points="190,70 240,120 220,125 180,80" fill="#f8fafc"/>
    <polygon points="290,70 240,120 260,125 300,80" fill="#f8fafc"/>
    <!-- Retro Vertical Stripes -->
    <rect x="180" y="150" width="24" height="200" fill="#dc2626"/>
    <rect x="228" y="150" width="24" height="200" fill="#ffffff"/>
    <rect x="276" y="150" width="24" height="200" fill="#dc2626"/>
    <!-- Vintage Club Shield Badge -->
    <path d="M195 125 L225 125 L225 145 C225 155 210 165 210 165 C210 165 195 155 195 145 Z" fill="#f59e0b"/>
    <circle cx="210" cy="142" r="5" fill="#172554"/>
    <!-- Classic Number '10' -->
    <text x="240" y="270" fill="#172554" font-family="'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="900" text-anchor="middle" stroke="#ffffff" stroke-width="2">10</text>
  </g>
</svg>
