<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSlip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="knitUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowSlip" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgSlip)" rx="24"/>
  <ellipse cx="300" cy="375" rx="200" ry="20" fill="#334155" opacity="0.15"/>
  <g filter="url(#shadowSlip)" transform="translate(50, 30)">
    <!-- White Minimalist Outsole -->
    <path d="M80 305 C140 310 320 310 440 285 C450 310 430 328 360 332 C230 335 110 330 80 305 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Flexible Knit Upper Body -->
    <path d="M85 300 C90 250 170 235 230 225 C270 215 310 185 365 185 C395 185 415 205 420 235 C430 265 430 275 425 285 C360 295 190 300 85 300 Z" fill="url(#knitUpper)"/>
    <!-- Elastic Collar Trim -->
    <path d="M310 190 C335 185 375 185 390 205 C370 215 340 210 310 190 Z" fill="#0f766e"/>
    <!-- Heel Pull Loop -->
    <rect x="405" y="190" width="12" height="25" rx="3" fill="#0f766e" transform="rotate(25 405 190)"/>
    <!-- Knit Texture Accent Lines -->
    <path d="M120 280 Q210 260 270 240" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M140 288 Q220 270 280 250" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M165 295 Q235 280 290 260" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
