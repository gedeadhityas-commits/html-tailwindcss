<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStreetKit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="kitBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadowStreetKit" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#18181b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgStreetKit)" rx="24"/>
  <ellipse cx="300" cy="390" rx="190" ry="20" fill="#09090b" opacity="0.16"/>
  <g filter="url(#shadowStreetKit)" transform="translate(60, 25)">
    <!-- Basketball Jersey Sleeveless Wide Cut -->
    <path d="M185 70 C220 90 260 90 295 70 L325 105 C310 145 305 175 330 195 L330 355 L150 355 L150 195 C175 175 170 145 155 105 Z" fill="url(#kitBody)"/>
    <!-- Striped Rib Collar & Armholes (Purple & Gold) -->
    <path d="M185 70 C220 90 260 90 295 70 L288 82 C258 100 222 100 192 82 Z" fill="#eab308"/>
    <path d="M185 70 C220 90 260 90 295 70 L284 87 C256 104 224 104 196 87 Z" fill="#7c3aed" opacity="0.9"/>
    <!-- Rib Armhole Left & Right -->
    <path d="M155 105 C170 145 175 175 150 195 L144 190 C167 172 162 144 149 110 Z" fill="#eab308"/>
    <path d="M325 105 C310 145 305 175 330 195 L336 190 C313 172 318 144 331 110 Z" fill="#eab308"/>
    <!-- Big Bold Arched Typography -->
    <text x="240" y="170" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="4">URBAN</text>
    <text x="240" y="275" fill="#eab308" font-family="'Plus Jakarta Sans', sans-serif" font-size="90" font-weight="900" text-anchor="middle">24</text>
    <!-- Bottom Jocktag -->
    <rect x="275" y="320" width="45" height="25" rx="3" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
    <text x="297" y="336" fill="#18181b" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" text-anchor="middle">IGAS</text>
  </g>
</svg>
