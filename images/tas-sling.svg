<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSling" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="bagSlingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowSling" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#064e3b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgSling)" rx="24"/>
  <ellipse cx="300" cy="390" rx="180" ry="20" fill="#065f46" opacity="0.15"/>
  <g filter="url(#shadowSling)" transform="translate(60, 20)">
    <!-- Crossbody Shoulder Strap -->
    <path d="M120 70 C240 60 360 120 380 200 L340 210 C320 150 220 100 120 105 Z" fill="#334155"/>
    <rect x="230" y="80" width="40" height="20" rx="4" fill="#0f766e"/>
    <!-- Main Sling Body (Teardrop / Ergonomic) -->
    <path d="M160 140 C240 110 320 140 340 220 C350 280 320 340 250 350 C180 355 140 310 130 250 C125 200 140 160 160 140 Z" fill="url(#bagSlingGrad)"/>
    <!-- Front Pocket Panel with Waterproof Zipper -->
    <path d="M160 210 C210 190 280 205 295 260 C305 310 270 340 230 345 C170 345 145 305 140 265 C138 235 150 215 160 210 Z" fill="#334155"/>
    <!-- Zipper Accent Line & Puller -->
    <path d="M170 215 Q230 205 285 240" stroke="#0f766e" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="285" cy="240" r="5" fill="#34d399"/>
    <!-- Minimalist Urban Logo Badge -->
    <rect x="200" y="270" width="44" height="18" rx="4" fill="#0f172a" stroke="#0f766e" stroke-width="1.5"/>
    <text x="222" y="282" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="1.5">URBAN</text>
  </g>
</svg>
