<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBrief" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="briefBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowBrief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgBrief)" rx="24"/>
  <ellipse cx="300" cy="385" rx="200" ry="20" fill="#1e293b" opacity="0.16"/>
  <g filter="url(#shadowBrief)" transform="translate(60, 30)">
    <!-- Rigid Padded Leather Handles -->
    <path d="M190 150 C190 100 220 80 240 80 C260 80 290 100 290 150" stroke="#0f766e" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M190 150 C190 100 220 80 240 80 C260 80 290 100 290 150" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Main Structured Briefcase Body -->
    <rect x="80" y="140" width="320" height="210" rx="18" fill="url(#briefBody)" stroke="#334155" stroke-width="2"/>
    <!-- Full-Width Horizontal Zipper Sleeve -->
    <line x1="100" y1="210" x2="380" y2="210" stroke="#475569" stroke-width="3"/>
    <rect x="230" y="206" width="20" height="8" rx="2" fill="#0f766e"/>
    <!-- Dual Magnetic Flap Front Pockets -->
    <rect x="105" y="235" width="125" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="120" y1="260" x2="215" y2="260" stroke="#0f766e" stroke-width="2"/>
    <rect x="250" y="235" width="125" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="265" y1="260" x2="360" y2="260" stroke="#0f766e" stroke-width="2"/>
    <!-- Executive Metal Accent Badge -->
    <rect x="220" y="155" width="40" height="14" rx="3" fill="#0f766e"/>
    <text x="240" y="165" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="1">15.6" PRO</text>
  </g>
</svg>
