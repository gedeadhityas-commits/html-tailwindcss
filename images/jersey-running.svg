    <path d="M310 100 C300 135 295 160 315 180 L320 175 C302 158 306 135 315 105 Z" fill="#ffffff"/>
    <!-- Neck Binding -->
    <path d="M190 75 C215 95 265 95 290 75 L285 85 C263 102 217 102 195 85 Z" fill="#ffffff"/>
    <!-- Perforated Laser Cut Holes Graphic -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="240" cy="140" r="3"/>
      <circle cx="230" cy="150" r="3"/>
      <circle cx="250" cy="150" r="3"/>
      <circle cx="220" cy="160" r="3"/>
      <circle cx="240" cy="160" r="3"/>
      <circle cx="260" cy="160" r="3"/>
      <circle cx="230" cy="170" r="3"/>
      <circle cx="250" cy="170" r="3"/>
    </g>
    <!-- Dynamic Reflector Striping -->
    <rect x="185" y="240" width="110" height="4" rx="2" fill="#ffffff"/>
    <text x="240" y="225" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="4">SPEED</text>
    <text x="240" y="280" fill="#ffffff" opacity="0.9" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">42.195 KM</text>
