    <path d="M190 75 C215 95 265 95 290 75 L310 100 C300 135 295 160 315 180 L315 350 L165 350 L165 180 C185 160 180 135 170 100 Z" fill="url(#singletBody)"/>
    <!-- Deep Armhole Trim -->
