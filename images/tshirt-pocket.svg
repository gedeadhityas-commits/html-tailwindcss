    <filter id="shadowTeePock" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#052e16" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgTeePock)" rx="24"/>
  <ellipse cx="300" cy="390" rx="190" ry="20" fill="#052e16" opacity="0.14"/>
